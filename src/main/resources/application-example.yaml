# Crydis 配置示例

# Spring Boot 项目配置示例
# 在 application.yml 或 application.properties 中添加以下配置

crydis:
  enable: true
  host: localhost
  port: 6379
  password:
  database: 0
  timeout: 3000
  max-active: 50
  max-idle: 10
  min-idle: 5
  max-wait: 3000

# ============================================
# 配置说明
# ============================================
# enable:        是否启用Crydis (true/false)
# host:          Redis服务器地址
# port:          Redis服务器端口 (默认: 6379)
# password:      Redis密码 (无密码则留空)
# database:      Redis数据库索引 (默认: 0)
# timeout:       连接超时时间，单位毫秒 (默认: 3000)
# max-active:    最大连接数 (默认: 50)
# max-idle:      最大空闲连接数 (默认: 10)
# min-idle:      最小空闲连接数 (默认: 5)
# max-wait:      最大等待时间，单位毫秒 (默认: 3000)
